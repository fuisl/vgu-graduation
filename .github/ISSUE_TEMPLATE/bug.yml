name: Bug
description: Something is broken
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: context
    attributes: { label: Context }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. ..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, placeholder: "- [ ] ..." }
  - type: textarea
    id: references
    attributes: { label: Design / docs / dependencies }
  - type: textarea
    id: outofscope
    attributes: { label: Out of scope }
