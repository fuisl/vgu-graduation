name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # Migration tests run against a real Postgres (same major version as production).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grad26
          POSTGRES_USER: grad
          POSTGRES_PASSWORD: grad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grad -d grad26"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_DB_USER: grad
      CI_DB_PASSWORD: grad_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Assembled from parts (not a literal URL) so the throwaway CI credential
      # doesn't trip the secretlint pre-commit rule for connection strings.
      - name: Point the API tests at the Postgres service
        run: echo "DATABASE_URL=postgres://${CI_DB_USER}:${CI_DB_PASSWORD}@localhost:5432/grad26" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # apps/web's `asciify` dependency is optional (see
      # docs/development/private-dependencies.md): CI has no GitHub read
      # access to semicolons-dev/asciify and needs none. pnpm skips it and
      # the build falls back to apps/web/vendor/asciify-stub.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Lint
        run: pnpm turbo lint --cache-dir=.turbo

      - name: Typecheck
        run: pnpm turbo typecheck --cache-dir=.turbo

      - name: Test
        run: pnpm turbo test --cache-dir=.turbo

      - name: Build
        run: pnpm turbo build --cache-dir=.turbo
