name: API image

# Builds and pushes the apps/api container image to Docker Hub. Only runs on
# main, and only credentials-bearing on that branch: pull_request builds the
# image (below) to catch a broken Dockerfile early, but never pushes and
# never sees the Docker Hub token, so a fork PR can't exfiltrate it.
#
# This workflow owns the image; it does not touch the cluster. Flux's image
# automation (ADR-004) in the separate fuisl/vgu-graduation-deployment
# repository watches fuisl/grad26-api on Docker Hub and bumps the deployed
# tag there — this repository never holds cluster credentials.
on:
  pull_request:
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-api.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-api.yml

concurrency:
  group: docker-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: fuisl/grad26-api
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
