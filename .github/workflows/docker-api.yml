name: API image

# Builds and pushes the apps/api container image to Docker Hub, only when
# something merges to main. Pull requests deliberately do not build the image
# (there is no staging backend deploy, and it saves compute); CI (ci.yml) still
# runs on every PR. Because PRs never run this workflow, a fork PR can't reach
# the Docker Hub token. A Dockerfile mistake is therefore only caught after
# merge; build locally with `docker build -f apps/api/Dockerfile .` when
# changing it.
#
# This workflow owns the image; it does not touch the cluster. Flux's image
# automation (ADR-004) in the separate fuisl/vgu-graduation-deployment
# repository watches fuisl/grad26-api on Docker Hub and bumps the deployed
# tag there — this repository never holds cluster credentials.
#
# Tags pushed per build:
#   latest                               convenience only; never deployed
#   sha-<7-char sha>                     find the image for a commit
#   main-<YYYYMMDDHHmmss UTC>-<7-char sha>  the tag Flux follows (#52)
# The main-* tag is what the Flux ImagePolicy sorts on: it filters
# ^main-(?P<ts>[0-9]{14})-[a-f0-9]{7}$, extracts $ts and picks the highest
# number. Do not change its format without updating that policy in
# fuisl/vgu-graduation-deployment. {{date}} is the workflow run time and
# {{sha}} is metadata-action's short sha (7 chars by default,
# DOCKER_METADATA_SHORT_SHA_LENGTH must stay unset).
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-api.yml
  # Rebuild by hand (Actions tab -> Run workflow) without a code change.
  workflow_dispatch:

concurrency:
  group: docker-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: fuisl/grad26-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
